name: Auto update version

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-sync-main
  cancel-in-progress: false

jobs:
  version:
    if: ${{ !contains(github.event.head_commit.message, 'chore: sync version') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump patch version and sync references
        run: |
          npm version patch --no-git-tag-version
          npm run version:sync

      - name: Commit version update
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/version.js README.md docs/HARNESS_CONTRACT.json
          if git diff --cached --quiet; then
            echo "No version changes to commit"
            exit 0
          fi
          git commit -m "chore: sync version v${VERSION} [skip ci]"
          git push
